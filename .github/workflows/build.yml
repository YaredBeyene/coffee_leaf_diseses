name: Coffee Leaf Disease Offline APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout ኮዱን ወደ v4 አሳድገነዋል
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Set up Java ን ወደ v4 አሳድገነዋል
      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'

      # 4. Install project dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Build Split Multi-Architecture Release APKs
      - name: Build Split Multi-Architecture Release APKs
        run: flutter build apk --release --split-per-abi

      # 6. የፋይል ማከማቻውን (Upload) ወደ v4 አሳድገነዋል (ይህ ነው ዋናው ማስተካከያ!)
      - name: Upload Generated APKs to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: coffee-leaf-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
